name: Release to NuGet

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release branch
        id: version
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          if [[ ! "$BRANCH" =~ ^releases/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production releases must run from a branch named releases/vX.Y.Z. Current branch: $BRANCH"
            exit 1
          fi

          TAG="${BRANCH#releases/}"
          VERSION="${TAG#v}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate CHANGELOG entry
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TAG_LINE=$(grep -m1 -E "^## \\[$TAG\\]" CHANGELOG.md || true)

          if [[ -z "$TAG_LINE" ]]; then
            echo "CHANGELOG.md must contain a section for $TAG before deploying."
            exit 1
          fi

          awk -v tag_line="$TAG_LINE" '
            $0 == tag_line { in_section=1; next }
            in_section && /^## / { exit }
            in_section
          ' CHANGELOG.md > release_notes.txt

          if [[ ! -s release_notes.txt ]]; then
            echo "CHANGELOG.md section for $TAG is empty."
            exit 1
          fi

      - name: Inspect release tag
        id: tag_state
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA="$(git rev-parse HEAD)"

          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_SHA="$(git rev-list -n 1 "$TAG")"

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

            if [[ "$TAG_SHA" == "$HEAD_SHA" ]]; then
              echo "matches_head=true" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG already points to $HEAD_SHA."
            else
              echo "matches_head=false" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG points to $TAG_SHA and will be moved to $HEAD_SHA."
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "matches_head=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist and will be created at $HEAD_SHA."
          fi

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --no-restore
          --configuration Release
          /p:Version=${{ steps.version.outputs.version }}
          /p:PackageVersion=${{ steps.version.outputs.version }}
          /p:MinVerVersionOverride=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack OctoMap
        run: >
          dotnet pack src/OctoMap/OctoMap.csproj
          --no-build
          --configuration Release
          --output ./nupkgs
          /p:Version=${{ steps.version.outputs.version }}
          /p:PackageVersion=${{ steps.version.outputs.version }}
          /p:MinVerVersionOverride=${{ steps.version.outputs.version }}

      - name: Pack OctoMap analyzers
        run: >
          dotnet pack src/OctoMap.Analyzers/OctoMap.Analyzers.csproj
          --no-build
          --configuration Release
          --output ./nupkgs
          /p:Version=${{ steps.version.outputs.version }}
          /p:PackageVersion=${{ steps.version.outputs.version }}
          /p:MinVerVersionOverride=${{ steps.version.outputs.version }}

      - name: NuGet trusted publishing login
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: GitHubActions

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkgs/*.nupkg -k ${{ steps.nuget_login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./nupkgs/*.snupkg -k ${{ steps.nuget_login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create or update release tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA="${{ steps.tag_state.outputs.head_sha }}"
          TAG_EXISTS="${{ steps.tag_state.outputs.exists }}"
          TAG_MATCHES_HEAD="${{ steps.tag_state.outputs.matches_head }}"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [[ "$TAG_EXISTS" == "true" && "$TAG_MATCHES_HEAD" == "true" ]]; then
            echo "Tag $TAG already points to $HEAD_SHA. Nothing to update."
          elif [[ "$TAG_EXISTS" == "true" ]]; then
            git tag --force "$TAG" "$HEAD_SHA"
            git push --force origin "refs/tags/$TAG"
          else
            git tag --force "$TAG" "$HEAD_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
